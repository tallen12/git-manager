[project]
name = "git-manager"
version = "0.1.0"
description = "Containerized service that keeps git branches rebased, with Claude-assisted conflict resolution and human approval"
readme = "README.md"
authors = [
    { name = "Tyler Allen", email = "tyler@prxengage.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cyclopts>=5.3.0",
    "fastapi>=0.161.1",
    "fastmcp>=4.1.3",
    "httpx>=0.28.1",
    "pydantic>=2.14.1",
    "pydantic-settings[yaml]>=2.16.1",
    "uvicorn>=0.54.0",
]

[project.scripts]
git-manager = "git_manager:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.2",
    "ty>=0.0.91",
]

[tool.ruff]
target-version = "py314"
line-length = 100
extend-exclude = ["design-docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "ASYNC", "RUF", "PTH"]

[tool.ty.rules]
all = "error"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["git_manager"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
