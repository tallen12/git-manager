# Git Manager settings. Copy to git-manager.yaml in the directory you run git-manager
# from, or point GM_SETTINGS_FILE at it. Flags, GM_* variables, .env and the secrets
# directory override these values.

# Where operations run: set exactly one of config, url or socket.
target:
  config: config.yaml            # local mode: run in-process against this config file
  # url: http://127.0.0.1:8765   # API mode over HTTP; the token comes from
  #                              # GM_TARGET__TOKEN or /run/secrets/gm_target__token
  # socket: /run/git-manager/api.sock   # API mode over the daemon's Unix socket
  # plain_http: loopback        # http:// only to loopback hosts; `allowed` sends the
  #                              # token unencrypted to any host

# Where `git-manager serve` listens.
http:
  host: 127.0.0.1
  port: 8765
  tokens_file: tokens.yaml       # required by serve; every HTTP request needs a token
  # socket: /run/git-manager/api.sock   # also serve on this Unix socket (mode 0660, its
  #                              # directory's group); requests over it have every scope

# The tokens file holds secrets: keep it readable by the daemon only. Each token is at
# least 32 characters (for example `openssl rand -hex 32`) and lists its scopes; none
# implies another. Never give an MCP client's token the approve scope.
#
#   tokens:
#     - name: operator
#       token: <64 hex characters>
#       scopes: [read, operate, approve]
#     - name: mcp-agent
#       token: <64 hex characters>
#       scopes: [read, operate]

# The MCP server.
mcp:
  name: git-manager
  path: /mcp                     # mount path on the REST server (M4)
